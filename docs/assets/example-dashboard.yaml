# Example dashboard for the Managed Switch (SNMP) integration.
# Settings > Dashboards > Add dashboard > New dashboard from scratch, then the three dots >
# Edit dashboard > three dots > Raw configuration editor, and paste this.
# It finds every switch and port by itself, in any language; nothing to adapt.
title: Switches
views:
  - title: Ports
    path: ports
    icon: mdi:switch
    cards:
      - type: markdown
        title: Which device is on which port
        content: |
          {% set ports = states.sensor
             | selectattr('entity_id', 'in', integration_entities('managed_switch'))
             | selectattr('attributes.device_count', 'defined')
             | sort(attribute='attributes.if_index') | list %}
          {% set ns = namespace(switches=[]) %}
          {% for port in ports %}{% set ns.switches = ns.switches + [device_id(port.entity_id)] %}{% endfor %}
          {% for switch in ns.switches | unique %}
          ### {{ device_attr(switch, 'name_by_user') or device_attr(switch, 'name') }}

          | Port | Link | Speed | Device |
          | --- | --- | --- | --- |
          {% for port in ports if device_id(port.entity_id) == switch -%}
          {% set device = port.state if port.state not in ['unknown', 'unavailable'] else '' -%}
          | {{ port.attributes.port }} | {{ '🟢' if port.attributes.link else '⚪' }} | {{ port.attributes.speed ~ ' Mbit/s' if port.attributes.speed else '' }} | {{ device | regex_replace('[|\\[\\]()<>!`*_\\n]', ' ') | truncate(60) }} |
          {% endfor %}
          {% endfor %}
