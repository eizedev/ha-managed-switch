name: Bug report
description: The card shows something wrong or nothing at all.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Card version and integration version
      placeholder: "card 0.1.0, ha-managed-switch 0.2.0"
    validations:
      required: true
  - type: input
    id: switch
    attributes:
      label: Switch model
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps; hide device names you do not want to share.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration
      render: yaml
