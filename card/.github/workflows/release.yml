name: Release

# A pushed tag vX.Y.Z runs the checks, builds dist/managed-switch-card.js with build provenance
# (`gh attestation verify`) and creates the GitHub release with it: the notes are the version's
# CHANGELOG.md section and the file's SHA-256. HACS installs the file from the release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write # the provenance signature
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release only commits that are on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - name: Check the version and write the notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > notes.md
      - run: npm run build
      - name: Add the checksum to the notes
        run: |
          sum=$(sha256sum dist/managed-switch-card.js | cut -d' ' -f1)
          printf '\n**Manual install:** %s, SHA-256:\n\n%s\n%s\n%s\n' "\`managed-switch-card.js\`" "\`\`\`text" "$sum" "\`\`\`" >> notes.md
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/managed-switch-card.js
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/managed-switch-card.js --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$TAG" dist/managed-switch-card.js --repo "$REPO" --title "$TAG" \
              --notes-file notes.md --verify-tag
          fi
