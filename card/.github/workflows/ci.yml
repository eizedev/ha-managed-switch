name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release runs the same checks before it publishes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # HACS installs a plugin from its latest release, so the check needs one. Before the first
      # release (and in the run that creates it) there is nothing to check yet.
      - name: Find a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view --repo "$REPO" --json tagName >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release yet; the HACS check runs from the first release on."
          fi
      - if: steps.release.outputs.exists == 'true'
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-06-08
        with:
          category: plugin

  # One stable name for branch protection, independent of the jobs above.
  ci-ok:
    name: CI passed
    if: always()
    needs: [check, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "a required job ended with: $result"; exit 1; }
          done
