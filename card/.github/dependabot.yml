version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Wait a week before proposing a freshly published version: a just-published release has
      # had no time for anyone to notice if it is malicious or broken.
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # The Node types follow the Node version in the workflows (node-version), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"
