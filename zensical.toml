[project]
site_name = "Managed Switch for Home Assistant"
site_description = "Home Assistant integration for managed network switches over SNMP"
site_url = "https://ha-managed-switch.eize.dev/"
repo_url = "https://github.com/eizedev/ha-managed-switch"
repo_name = "eizedev/ha-managed-switch"
edit_uri = "edit/main/docs/"
copyright = "MIT licensed · Not affiliated with any switch vendor"
extra_css = ["assets/site.css"]
nav = [
  { "Overview" = "index.md" },
  { "Installation" = "installation.md" },
  { "Configuration" = "configuration.md" },
  { "Entities" = "entities.md" },
  { "Events" = "events.md" },
  { "Dashboard" = "dashboard.md" },
  { "Troubleshooting" = "troubleshooting.md" },
]

[project.theme]
language = "en"
logo = "assets/icon.svg"
favicon = "assets/icon.svg"
# Fonts come from the system; nothing is loaded from Google.
font = false
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
