name: Feature request
description: Suggest something the integration should show or do.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should the integration show or do, and what would you use it for?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which MIB has it?
      description: The standard MIB and object, if you know it (e.g. ENTITY-SENSOR-MIB).
