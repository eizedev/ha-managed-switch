name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste raw SNMP output or unredacted logs: they contain MAC addresses,
        IP addresses and device names. Download the integration's diagnostics instead
        (Settings, Devices & services, Managed Switch (SNMP), the three dots, Download
        diagnostics); they contain no addresses or names.
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Switch model and firmware
      placeholder: "HPE OfficeConnect 1920S (JL383A), PD.02.22"
    validations:
      required: true
  - type: dropdown
    id: snmp
    attributes:
      label: SNMP version
      options: ["v3", "v2c", "v1"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the downloaded diagnostics; read them before posting.
      render: json
